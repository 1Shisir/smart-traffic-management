<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Traffic Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>
  <header>
    <h1>🚦 Smart Traffic Dashboard</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>

  <div class="status-bar">
    <div class="status-item">
      <div>System Status</div>
      <div class="status-value" id="system-status">🟢 Active</div>
    </div>
    <div class="status-item">
      <div>Last Detection</div>
      <div class="status-value" id="last-detection">--:--:--</div>
    </div>
  </div>

  <div class="dashboard-container">
    <div class="card">
      <h2>Current Vehicle Count</h2>
      <div class="status-value" id="current_count">0</div>
      <p>Last updated: <span id="last_update">--:--:--</span></p>
      <div class="vehicle-counts">
        <div class="vehicle-box">
          <span id="car-count">0</span>
          🚗 Cars
        </div>
        <div class="vehicle-box">
          <span id="bus-count">0</span>
          🚌 Buses
        </div>
        <div class="vehicle-box">
          <span id="truck-count">0</span>
          🚚 Trucks
        </div>
        <div class="vehicle-box">
          <span id="motorcycle-count">0</span>
          🏍️ Motorcycles
        </div>
      </div>
      <div id="alert" class="alert">Awaiting data...</div>
      <div><strong>Status:</strong> <span id="traffic-status">No data</span></div>
    </div>

    <div class="card">
      <h2>Traffic Trends</h2>
      <canvas id="trafficChart"></canvas>
    </div>

    <div class="card">
      <h2>Live Detection Video</h2>
      <video id="video-preview" width="100%" controls autoplay muted>
        <source src="/video-stream" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <button class="btn" id="refresh-preview">Refresh Video</button>
    </div>

    <div class="card">
      <h2>Traffic Light Control</h2>
      <div class="traffic-control">
        <div class="traffic-light-container">
          <div class="traffic-light red" id="red-light"></div>
          <div class="traffic-light yellow" id="yellow-light"></div>
          <div class="traffic-light green" id="green-light"></div>
        </div>
        <div class="traffic-pole"></div>
        <div class="traffic-timer" id="light-timer">--</div>
        <div class="traffic-phase" id="light-phase">Initializing...</div>
      </div>
    </div>
  </div>

  <script>
    const socket = io('/dashboard', {
      withCredentials: true
    });
    const chart = new Chart(document.getElementById('trafficChart').getContext('2d'), {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Total Vehicles',
          data: [],
          borderColor: '#4f46e5',
          backgroundColor: 'rgba(79,70,229,0.1)',
          fill: true,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: { beginAtZero: true, title: { display: true, text: 'Vehicles' } },
          x: { title: { display: true, text: 'Time' } }
        },
        plugins: {
          legend: { display: true, position: 'top' },
          tooltip: { backgroundColor: '#1e293b', titleFont: { weight: 'bold' } }
        }
      }
    });

    // Traffic light state management
    let currentLightState = null;
    let lightTimer = null;

    function updateTrafficLight(data) {
      if (lightTimer) clearInterval(lightTimer);
      document.getElementById('light-phase').textContent = 
        data.state.charAt(0).toUpperCase() + data.state.slice(1) + " Light";
      document.querySelectorAll('.traffic-light').forEach(light => light.classList.remove('active'));
      const activeLight = document.getElementById(data.state + '-light');
      if (activeLight) activeLight.classList.add('active');
      let seconds = data.duration;
      updateTimerDisplay(seconds);
      lightTimer = setInterval(() => {
        seconds--;
        updateTimerDisplay(seconds);
        if (seconds <= 0) clearInterval(lightTimer);
      }, 1000);
      currentLightState = data.state;
    }

    function updateTimerDisplay(seconds) {
      const timerElement = document.getElementById('light-timer');
      timerElement.textContent = seconds >= 0 ? seconds : '--';
      timerElement.style.color = seconds < 5 && currentLightState === 'red' ? '#ff4444' :
                                seconds < 3 && currentLightState === 'yellow' ? '#ffcc00' : 'inherit';
    }

    socket.on('update', data => {
      console.log("Received update via socket:", data);
      document.getElementById('current_count').textContent = data.count;
      document.getElementById('last_update').textContent = data.time;
      document.getElementById('last-detection').textContent = data.time;
      document.getElementById('car-count').textContent = data.car || 0;
      document.getElementById('bus-count').textContent = data.bus || 0;
      document.getElementById('truck-count').textContent = data.truck || 0;
      document.getElementById('motorcycle-count').textContent = data.motorcycle || 0;

      const statusEl = document.getElementById('traffic-status');
      const alertEl = document.getElementById('alert');
      if (data.count > 15) {
        statusEl.textContent = "Heavy Traffic";
        statusEl.style.color = '#ef4444';
        alertEl.textContent = "⚠️ Heavy Congestion! Consider alternate routes.";
        alertEl.className = "alert alert-danger";
      } else if (data.count > 10) {
        statusEl.textContent = "Moderate Traffic";
        statusEl.style.color = '#facc15';
        alertEl.textContent = "⚠️ Moderate traffic building up";
        alertEl.className = "alert alert-warning";
      } else {
        statusEl.textContent = "Light Traffic";
        statusEl.style.color = '#22c55e';
        alertEl.textContent = "✅ Traffic flowing normally";
        alertEl.className = "alert alert-success";
      }

      chart.data.labels.push(data.time);
      chart.data.datasets[0].data.push(data.count);
      if (chart.data.labels.length > 30) {
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
      }
      chart.update('none');
    });

    socket.on('traffic_light', updateTrafficLight);

    document.getElementById('refresh-preview').addEventListener('click', () => {
      const video = document.getElementById('video-preview');
      video.src = '/video-stream?' + new Date().getTime();
      video.load();
    });

    // Logout functionality
    async function logout() {
      try {
        const response = await fetch('/logout', {
          method: 'POST',
          credentials: 'include'
        });
        if (response.redirected) {
          window.location.href = response.url;
        } else {
          alert('Logout failed. Please try again.');
        }
      } catch (error) {
        console.error('Logout error:', error);
        alert('Error during logout. Please try again.');
      }
    }

    // Initialize traffic light
    updateTrafficLight({state: 'red', duration: 0});
  </script>
</body>
</html>
