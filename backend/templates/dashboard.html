<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Traffic Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>
  <header>
    <h1>🚦 Smart Traffic Dashboard</h1>
    <div class="header-controls">
      <button class="start-btn" id="start-processing">Start Processing</button>
      <button class="stop-btn" id="stop-processing" style="display: none;">Stop Processing</button>
      <button class="danger-btn" id="stop-server">Stop Server</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="status-bar">
    <div class="status-item">
      <div>System Status</div>
      <div class="status-value" id="system-status">🟢 Active</div>
    </div>
    <div class="status-item">
      <div>Last Detection</div>
      <div class="status-value" id="last-detection">--:--:--</div>
    </div>
  </div>

  <div class="dashboard-container">
    <div class="card">
      <h2>Current Vehicle Count</h2>
      <div class="status-value" id="current_count">0</div>
      <p>Last updated: <span id="last_update">--:--:--</span></p>
      <div class="vehicle-counts">
        <div class="vehicle-box">
          <span id="car-count">0</span>
          🚗 Cars
        </div>
        <div class="vehicle-box">
          <span id="bus-count">0</span>
          🚌 Buses
        </div>
        <div class="vehicle-box">
          <span id="truck-count">0</span>
          🚚 Trucks
        </div>
        <div class="vehicle-box">
          <span id="motorcycle-count">0</span>
          🏍️ Motorcycles
        </div>
      </div>
      <div id="alert" class="alert alert-warning">Click "Start Processing" to begin</div>
      <div><strong>Status:</strong> <span id="traffic-status">No data</span></div>
      <div><strong>Last Update:</strong> <span id="last-detection">Never</span></div>
    </div>

    <div class="card">
      <h2>Video Stream</h2>
      <video id="video-stream" width="100%" controls muted style="max-width: 640px;">
        <source src="/video-stream" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <button class="btn" id="refresh-stream">Refresh Stream</button>
    </div>

    <div class="card">
      <h2>Traffic Light Control</h2>
      <div class="traffic-control">
        <div class="traffic-light-container">
          <div class="traffic-light red" id="red-light"></div>
          <div class="traffic-light yellow" id="yellow-light"></div>
          <div class="traffic-light green" id="green-light"></div>
        </div>
        <div class="traffic-pole"></div>
        <div class="traffic-timer" id="light-timer">--</div>
        <div class="traffic-phase" id="light-phase">Initializing...</div>
      </div>
    </div>
  </div>

  <script>
    const socket = io('http://localhost:5000', {
      transports: ['websocket', 'polling'],
      reconnection: true,
      reconnectionAttempts: 5,
      reconnectionDelay: 1000,
      withCredentials: true  // Include cookies for authentication
    });

    socket.on('connect', () => {
      console.log('SocketIO connected');
      // Get current processing status on connect
      socket.emit('get_processing_status', {});
      loadRecentData();
    });

    socket.on('connection_status', (data) => {
      console.log('Connection confirmed for user:', data.user);
      document.getElementById('system-status').textContent = '🟢 Connected';
    });

    socket.on('auth_required', (data) => {
      console.log('Authentication required:', data);
      alert('Session expired. Please login again.');
      window.location.href = '/login';
    });

    socket.on('connect_error', (error) => {
      console.error('SocketIO connection error:', error);
      document.getElementById('system-status').textContent = '🔴 Connection Error';
      loadRecentData();
      startPolling();
    });

    socket.on('disconnect', () => {
      console.log('SocketIO disconnected');
      document.getElementById('system-status').textContent = '🔴 Disconnected';
      startPolling();
    });

    socket.on('processing_started', (data) => {
      console.log('Processing started:', data);
      document.getElementById('system-status').textContent = '🟢 Processing Active';
      document.getElementById('alert').textContent = `Processing started: ${data.message}`;
      document.getElementById('alert').className = 'alert alert-success';
      
      // Update button states
      document.getElementById('start-processing').style.display = 'none';
      document.getElementById('stop-processing').style.display = 'inline-block';
    });

    socket.on('processing_stopped', (data) => {
      console.log('Processing stopped:', data);
      document.getElementById('system-status').textContent = '🔴 Inactive';
      document.getElementById('alert').textContent = `Processing stopped: ${data.message}`;
      document.getElementById('alert').className = 'alert alert-warning';
      
      // Update button states
      document.getElementById('start-processing').style.display = 'inline-block';
      document.getElementById('stop-processing').style.display = 'none';
    });

    socket.on('processing_error', (data) => {
      console.error('Processing error:', data);
      document.getElementById('system-status').textContent = '🔴 Error';
      document.getElementById('alert').textContent = `Error: ${data.message}`;
      document.getElementById('alert').className = 'alert alert-danger';
      
      // Reset button states
      document.getElementById('start-processing').style.display = 'inline-block';
      document.getElementById('stop-processing').style.display = 'none';
    });

    socket.on('processing_status', (data) => {
      console.log('Processing status:', data);
      if (data.active) {
        document.getElementById('system-status').textContent = '🟢 Processing Active';
        document.getElementById('start-processing').style.display = 'none';
        document.getElementById('stop-processing').style.display = 'inline-block';
      } else {
        document.getElementById('system-status').textContent = '🔴 Inactive';
        document.getElementById('start-processing').style.display = 'inline-block';
        document.getElementById('stop-processing').style.display = 'none';
      }
    });

    // Traffic light state management
    let currentLightState = null;
    let lightTimer = null;
    let statsData = {
      totalDetected: 0,
      peakCount: 0,
      avgSpeed: 0,
      densityLevel: 'Low'
    };

    function updateTrafficLight(data) {
      if (lightTimer) clearInterval(lightTimer);
      document.getElementById('light-phase').textContent = 
        data.state.charAt(0).toUpperCase() + data.state.slice(1) + " Light";
      document.querySelectorAll('.traffic-light').forEach(light => light.classList.remove('active'));
      const activeLight = document.getElementById(data.state + '-light');
      if (activeLight) activeLight.classList.add('active');
      let seconds = data.duration;
      updateTimerDisplay(seconds);
      lightTimer = setInterval(() => {
        seconds--;
        updateTimerDisplay(seconds);
        if (seconds <= 0) clearInterval(lightTimer);
      }, 1000);
      currentLightState = data.state;
    }

    function updateTimerDisplay(seconds) {
      const timerElement = document.getElementById('light-timer');
      timerElement.textContent = seconds >= 0 ? seconds : '--';
      timerElement.style.color = seconds < 5 && currentLightState === 'red' ? '#ff4444' :
                                seconds < 3 && currentLightState === 'yellow' ? '#ffcc00' : 'inherit';
    }

    socket.on('update', data => {
      console.log("Received update via socket:", data);
      document.getElementById('current_count').textContent = data.count;
      document.getElementById('last_update').textContent = data.time;
      document.getElementById('last-detection').textContent = data.time;
      document.getElementById('car-count').textContent = data.car || 0;
      document.getElementById('bus-count').textContent = data.bus || 0;
      document.getElementById('truck-count').textContent = data.truck || 0;
      document.getElementById('motorcycle-count').textContent = data.motorcycle || 0;

      const statusEl = document.getElementById('traffic-status');
      const alertEl = document.getElementById('alert');
      if (data.count > 15) {
        statusEl.textContent = "Heavy Traffic";
        statusEl.style.color = '#ef4444';
        alertEl.textContent = "⚠️ Heavy Congestion! Consider alternate routes.";
        alertEl.className = "alert alert-danger";
      } else if (data.count > 10) {
        statusEl.textContent = "Moderate Traffic";
        statusEl.style.color = '#facc15';
        alertEl.textContent = "⚠️ Moderate traffic building up";
        alertEl.className = "alert alert-warning";
      } else {
        statusEl.textContent = "Light Traffic";
        statusEl.style.color = '#22c55e';
        alertEl.textContent = "✅ Traffic flowing normally";
        alertEl.className = "alert alert-success";
      }

      // Update stats
      statsData.totalDetected += data.count;
      statsData.peakCount = Math.max(statsData.peakCount, data.count);
      statsData.densityLevel = data.count > 15 ? 'High' : data.count > 10 ? 'Medium' : 'Low';
      
      document.getElementById('total-detected').textContent = statsData.totalDetected;
      document.getElementById('peak-count').textContent = statsData.peakCount;
      document.getElementById('traffic-density').textContent = statsData.densityLevel;
      
      // Update traffic light if data includes light info
      if (data.traffic_light && data.light_duration) {
        updateTrafficLight({
          state: data.traffic_light,
          duration: data.light_duration
        });
      }
      
      // Update system status to show it's actively receiving data
      document.getElementById('system-status').textContent = '🟢 Processing Active';
    });

    socket.on('traffic_light', updateTrafficLight);

    document.getElementById('refresh-stream').addEventListener('click', () => {
      const video = document.getElementById('video-stream');
      video.src = '/video-stream?' + new Date().getTime();
      video.load();
    });
    async function loadRecentData() {
      try {
        const response = await fetch('/api/data', { credentials: 'include' });
        if (response.ok) {
          const result = await response.json();
          console.log('Fetched recent data:', result);
          
          // Handle new API response format
          const data = result.data || result;
          if (data && data.length > 0) {
            const latest = data[0];
            document.getElementById('current_count').textContent = latest.total;
            document.getElementById('car-count').textContent = latest.car;
            document.getElementById('bus-count').textContent = latest.bus;
            document.getElementById('truck-count').textContent = latest.truck;
            document.getElementById('motorcycle-count').textContent = latest.motorcycle;
            document.getElementById('last_update').textContent = latest.timestamp.split(' ')[1];
            
            updateTrafficLight({
              state: latest.traffic_light,
              duration: latest.light_duration
            });
          }
        } else {
          console.error('Failed to fetch recent data:', response.status);
          document.getElementById('alert').textContent = 'Failed to load recent data';
          document.getElementById('alert').className = 'alert alert-danger';
        }
      } catch (error) {
        console.error('Error fetching recent data:', error);
        document.getElementById('alert').textContent = `Error fetching data: ${error.message}`;
        document.getElementById('alert').className = 'alert alert-danger';
      }
    }

    function startPolling() {
      if (pollingInterval) clearInterval(pollingInterval);
      pollingInterval = setInterval(loadRecentData, 10000); // Poll every 10 seconds
    }

    // Button event handlers
    document.getElementById('start-processing').addEventListener('click', () => {
      socket.emit('start_processing', { junction: 'junction1' });
      console.log('Emitted start_processing event');
      document.getElementById('alert').textContent = 'Starting video processing...';
      document.getElementById('alert').className = 'alert alert-warning';
      document.getElementById('start-processing').disabled = true;
      
      // Re-enable button after delay
      setTimeout(() => {
        document.getElementById('start-processing').disabled = false;
      }, 3000);
    });

    document.getElementById('stop-processing').addEventListener('click', () => {
      socket.emit('stop_processing', {});
      console.log('Emitted stop_processing event');
      document.getElementById('alert').textContent = 'Stopping video processing...';
      document.getElementById('alert').className = 'alert alert-warning';
      document.getElementById('stop-processing').disabled = true;
      
      // Re-enable button after delay
      setTimeout(() => {
        document.getElementById('stop-processing').disabled = false;
      }, 3000);
    });

    document.getElementById('stop-server').addEventListener('click', () => {
      if (confirm('Are you sure you want to stop the server? This will disconnect all users.')) {
        socket.emit('stop_server', {});
        console.log('Emitted stop_server event');
        document.getElementById('alert').textContent = 'Server shutdown initiated...';
        document.getElementById('alert').className = 'alert alert-danger';
        
        // Disconnect and redirect after delay
        setTimeout(() => {
          window.location.href = '/';
        }, 2000);
      }
    });

    // Re-enable buttons and update UI based on events
    socket.on('processing_started', (data) => {
      document.getElementById('start-processing').disabled = false;
      document.getElementById('stop-processing').disabled = false;
    });

    socket.on('processing_stopped', (data) => {
      document.getElementById('start-processing').disabled = false;
      document.getElementById('stop-processing').disabled = false;
    });

    socket.on('processing_error', (data) => {
      document.getElementById('start-processing').disabled = false;
      document.getElementById('stop-processing').disabled = false;
    });


    // Logout functionality
    async function logout() {
      try {
        const response = await fetch('/logout', {
          method: 'POST',
          credentials: 'include'
        });
        if (response.redirected) {
          window.location.href = response.url;
        } else {
          alert('Logout failed. Please try again.');
        }
      } catch (error) {
        console.error('Logout error:', error);
        alert('Error during logout. Please try again.');
      }
    }

    // Initialize traffic light
    updateTrafficLight({state: 'red', duration: 0});
  </script>
</body>
</html>
